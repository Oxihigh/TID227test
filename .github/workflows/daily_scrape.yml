name: Daily Toastmasters Data Scraper

on:
  schedule:
    # Runs every day at 10:00 AM UTC (adjust as needed)
    - cron: '0 10 * * *'
  # Allows you to trigger the workflow manually from the GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run scraper
        run: python download.py

      - name: Commit and push updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ *.log
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily update of CSV data and logs"
          git push
